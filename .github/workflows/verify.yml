name: Verify packages

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install build twine
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYTHON'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ.get("RELEASE_TAG")
          if tag:
              assert tag == f"v{version}", (tag, version)
          PYTHON
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the built wheel and test tools
        shell: bash
        run: |
          python -m pip install pytest ruff
          python - <<'PYTHON'
          import pathlib, subprocess, sys
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          subprocess.check_call([sys.executable, "-m", "pip", "install", f"{wheel}[hero,usdz,gltf,obj,stl,legacy]"])
          PYTHON
      - name: Check installed package location
        run: python -c "import structura_render; assert 'site-packages' in structura_render.__file__, structura_render.__file__"
      - run: python -m ruff check src tests
      - run: python -m pytest -q tests

  extras:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [base, hero, usdz, gltf, obj, stl]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install and import each extra independently
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          python - <<'PYTHON'
          import importlib, importlib.util, os, pathlib, subprocess, sys
          extra = os.environ["EXTRA"]
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          requirement = str(wheel) if extra == "base" else f"{wheel}[{extra}]"
          subprocess.check_call([sys.executable, "-m", "pip", "install", requirement])
          subprocess.check_call([sys.executable, "-m", "pip", "check"])
          importlib.import_module("structura_render.projections" if extra == "base" else "structura_render.mesh")
          importlib.import_module("structura_render.projections" if extra == "base" else f"structura_render.{extra}")
          if extra in {"gltf", "obj", "stl"}:
              importlib.import_module("structura_render.mesh_export")
          if extra == "usdz":
              importlib.import_module("pxr.Usd")
          if extra == "hero":
              importlib.import_module("pyvista")
          else:
              assert importlib.util.find_spec("pyvista") is None
              assert importlib.util.find_spec("vtkmodules") is None
          if extra in {"base", "hero", "usdz"}:
              assert importlib.util.find_spec("trimesh") is None
          PYTHON

  interoperability:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install public API and validation tools
        run: |
          python -m pip install pytest pyright==1.1.411
          python - <<'PYTHON'
          import pathlib, subprocess, sys
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          subprocess.check_call([sys.executable, "-m", "pip", "install", f"{wheel}[gltf]"])
          PYTHON
          npm install --prefix "$RUNNER_TEMP/structura-validation" --ignore-scripts gltf-validator@2.0.0-dev.3.10
      - name: Check public types outside the source checkout
        run: |
          mkdir -p "$RUNNER_TEMP/structura-types/checks"
          cp checks/public_api.py "$RUNNER_TEMP/structura-types/checks/"
          cp pyrightconfig.json "$RUNNER_TEMP/structura-types/"
          cd "$RUNNER_TEMP/structura-types"
          pyright --pythonpath "$(which python)"
      - name: Validate exports with Khronos and run packaged examples
        run: |
          export NODE_PATH="$RUNNER_TEMP/structura-validation/node_modules"
          export STRUCTURA_GLTF_VALIDATOR="$GITHUB_WORKSPACE/checks/validate_gltf.cjs"
          python -m pytest -q tests/test_geometry_exports.py -k khronos
          structura-render examples "$RUNNER_TEMP/structura-demo"
          structura-render doctor --json
          structura-render projections "$RUNNER_TEMP/structura-demo/demo.nbt" "$RUNNER_TEMP/structura-demo/floor.png" --views top --depth 1 4
          structura-convert "$RUNNER_TEMP/structura-demo/demo.nbt" "$RUNNER_TEMP/structura-demo/demo.litematic" --strict
          structura-render gltf "$RUNNER_TEMP/structura-demo/demo.nbt" "$RUNNER_TEMP/structura-demo/demo.glb" --allow-flat-fallback
          node checks/validate_gltf.cjs "$RUNNER_TEMP/structura-demo/demo.glb"
