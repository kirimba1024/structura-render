[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structura-render"
version = "0.8.3"
description = "Minecraft PNG/SVG rendering and 3D export (USD/USDZ, glTF, OBJ, STL, VOX)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "structura-core>=0.6.2,<0.7",
  "numpy>=1.26,<3",
  "Pillow>=11,<12",
]

[project.optional-dependencies]
overview = []
hero = ["pyvista>=0.46,<0.47"]
usdz = ["usd-core>=26,<27"]
gltf = ["trimesh>=4.5,<5", "networkx>=3.2,<4"]
obj = ["trimesh>=4.5,<5", "networkx>=3.2,<4"]
stl = ["trimesh>=4.5,<5", "networkx>=3.2,<4"]
legacy = ["structura-core[legacy]>=0.6.2,<0.7"]
bedrock = ["structura-core[bedrock]>=0.6.2,<0.7"]

[project.scripts]
structura-render = "structura_render.__main__:main"
structura-render-projections = "structura_render.projections:main"
structura-render-hero = "structura_render.hero:main"
structura-export-usdz = "structura_render.usdz:main"
structura-export-gltf = "structura_render.gltf:main"
structura-export-obj = "structura_render.obj:main"
structura-export-stl = "structura_render.stl:main"
structura-build-full-cube-list = "structura_render.build_full_cube_list:main"
structura-build-opaque-blocks = "structura_render.build_opaque_blocks:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
structura_render = ["data/*.json", "data/examples/*", "py.typed", "*.pyi"]

[project.urls]
Documentation = "https://github.com/kirimba1024/structura-render#readme"
Issues = "https://github.com/kirimba1024/structura-render/issues"
Changelog = "https://github.com/kirimba1024/structura-render/blob/main/CHANGELOG.md"
Repository = "https://github.com/kirimba1024/structura-render"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
